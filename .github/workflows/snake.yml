
name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: Rajukumar1202
          
          outputs: |
            dist/github-snake.svg?color_snake=%2300D9FF&color_dots=%230D1117%2C%230B2E4F%2C%230075B8%2C%2300A6FF%2C%2300D9FF
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%2300D9FF&color_dots=%230D1117%2C%230B2E4F%2C%230075B8%2C%2300A6FF%2C%2300D9FF


      - name: Publish generated files
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
